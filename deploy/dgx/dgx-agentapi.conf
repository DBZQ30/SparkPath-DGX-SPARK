# /etc/nginx/conf.d/hermes-agents/dgx-agentapi.conf
#
# 用途：把 https://isom.xjtu.edu.cn/accapi/dgx-agentapi/* 路由到 dgx 的问答管线
#
# 链路：校园网关(xqwebsn) -> acc-svr nginx -> SSH 反向隧道(127.0.0.1:18000)
#       -> dgx miniapp-proxy(127.0.0.1:8020) -> hermes miniapp 适配器(127.0.0.1:8010)
#
# 为什么这样写：
#   1) proxy_pass **不带 URI**，nginx 原样透传请求路径，不做前缀替换
#      （带 URI 的写法在多层级联下实测会产生 `////api/...` 这类重复斜杠）。
#   2) 路径的归一化与前缀剥离统一交给 dgx 的 miniapp-proxy 处理
#      （见 agent4som/miniapp_proxy/app.py 的 _target_path）。
#   3) 校园网关只放行 /accapi/ 开头的路径，所以路由必须挂在 /accapi/ 下。
#
# 对应的小程序侧配置：把 API_BASE_URL 指向 https://isom.xjtu.edu.cn/accapi/dgx-agentapi/
location /accapi/dgx-agentapi {
    proxy_pass http://127.0.0.1:18000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;   # 知识库/对话附件上传（hermes 适配器上限 10MB）
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
}
