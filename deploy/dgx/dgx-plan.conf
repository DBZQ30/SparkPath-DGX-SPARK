# /etc/nginx/conf.d/hermes-agents/dgx-plan.conf
#
# 用途：把 https://isom.xjtu.edu.cn/accapi/dgx-plan/* 路由到 dgx 的「培养方案解读」API
#
# 链路：校园网关(xqwebsn) -> acc-svr nginx -> SSH 反向隧道(127.0.0.1:18009) -> dgx :8009
#
# 为什么用 rewrite + 不带 URI 的 proxy_pass（与 dgx-warning.conf 同因）：
#   1) 解读 API 的路由是 /api/plan/*（无前缀），必须剥掉 /accapi/dgx-plan。
#   2) 带 URI 的 proxy_pass 在本机多层级联下实测会产出 ////api/... 这类重复斜杠，
#      故显式 rewrite（确定性）+ proxy_pass 不带 URI（原样透传 rewrite 结果）。
#   3) 校园网关只放行 /accapi/ 开头的路径，所以路由必须挂在 /accapi/ 下。
#
# 对应的小程序侧配置：PLAN_API_BASE = https://isom.xjtu.edu.cn/accapi/dgx-plan
#   （前端拼出 /api/plan/status、/api/plan/upload、/api/plan/prereq-image 等）
#
# ⚠️ 图片域名白名单：解读页/校对页要加载 `/api/plan/prereq-image`（先修关系原图），
#   微信需在「downloadFile 合法域名」中加入 isom.xjtu.edu.cn，否则图片静默不显示
#   （L7 同 007：request / uploadFile / downloadFile 三类独立配置）。
location /accapi/dgx-plan {
    rewrite ^/accapi/dgx-plan/?(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:18009;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    # 上传/状态接口本身很快（解析在后台队列），但先修原图与可能的大响应留足余量
    proxy_read_timeout 300s;
    # 培养方案 docx 上传（服务端另有 10MB 上限校验）
    client_max_body_size 20m;
}
