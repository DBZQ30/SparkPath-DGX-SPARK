# /etc/nginx/conf.d/hermes-agents/dgx-warning.conf
#
# 用途：把 https://isom.xjtu.edu.cn/accapi/dgx-warning/* 路由到 dgx 的学业预警 API
#
# 链路：校园网关(xqwebsn) -> acc-svr nginx -> SSH 反向隧道(127.0.0.1:18008) -> dgx :8008
#
# 为什么用 rewrite + 不带 URI 的 proxy_pass：
#   1) 预警 API 的路由是 /api/warning/*（无前缀），必须剥掉 /accapi/dgx-warning。
#   2) 带 URI 的 proxy_pass 在本机多层级联下实测会产出 ////api/... 这类重复斜杠，
#      故显式 rewrite（确定性）+ proxy_pass 不带 URI（原样透传 rewrite 结果）。
#   3) 校园网关只放行 /accapi/ 开头的路径，所以路由必须挂在 /accapi/ 下。
#
# 对应的小程序侧配置：WARNING_API_BASE = https://isom.xjtu.edu.cn/accapi/dgx-warning
#   （前端拼出 /api/warning/status、/api/warning/upload 等）
location /accapi/dgx-warning {
    rewrite ^/accapi/dgx-warning/?(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:18008;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 300s;
    # 学业预警上传五类数据文件（培养方案/选课/成绩单/课表/学籍异动），
    # 与 007 设计文档的 nginx 片段一致
    client_max_body_size 20m;
}
